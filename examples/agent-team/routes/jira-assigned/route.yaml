name: jira-assigned
description: Start an implementation run when Jira assigns work to the configured user.
priority: 100
when:
  source: jira-main
  type: jira.issue.assigned
invoke:
  team: engineering
  agent: implementer
  workspace: product
  harness: claude-code
  permission: readwrite
tests:
  - name: assigned issue
    event:
      source: jira-main
      type: jira.issue.assigned
      subject: ABC-123
      data:
        issue_key: ABC-123
    expect: jira-assigned

