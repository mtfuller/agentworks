name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build macOS binaries and draft a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Prebuilt convenience downloads for anyone not using Homebrew. The
      # Homebrew formula itself builds from the tag's source archive instead
      # (see .github/workflows/homebrew.yml) -- these tarballs aren't part of
      # that path.
      - name: Build (darwin/arm64, darwin/amd64)
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG=github.com/mtfuller/agentworks/internal/version
          for ARCH in arm64 amd64; do
            mkdir -p "dist/agentworks_darwin_${ARCH}"
            GOOS=darwin GOARCH="$ARCH" go build -trimpath \
              -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${GITHUB_SHA} -X ${PKG}.BuildDate=${BUILD_DATE}" \
              -o "dist/agentworks_darwin_${ARCH}/agentworks" ./main.go
          done

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          : > SHA256SUMS
          for ARCH in arm64 amd64; do
            cp LICENSE README.md "dist/agentworks_darwin_${ARCH}/"
            tar -C "dist/agentworks_darwin_${ARCH}" -czf "agentworks_${VERSION}_darwin_${ARCH}.tar.gz" agentworks LICENSE README.md
            shasum -a 256 "agentworks_${VERSION}_darwin_${ARCH}.tar.gz" >> SHA256SUMS
          done

      - name: Draft release notes
        run: |
          cat > NOTES.md <<'EOF'
          ## agentworks ${{ github.ref_name }}

          Prebuilt macOS binaries for Apple Silicon (arm64) and Intel (amd64).

          The binaries are **not notarized**. After downloading and extracting, clear
          the Gatekeeper quarantine flag before first run:

          ```bash
          xattr -d com.apple.quarantine agentworks
          ./agentworks version
          ```

          Verify the download:

          ```bash
          shasum -a 256 -c SHA256SUMS
          ```

          Or install via Homebrew (builds from source, works on both architectures):

          ```bash
          brew install mtfuller/tap/agentworks
          ```
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "agentworks ${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            agentworks_*_darwin_*.tar.gz \
            SHA256SUMS
