name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build binaries and draft a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Prebuilt convenience downloads for anyone not using Homebrew. The
      # Homebrew formula itself builds from the tag's source archive instead
      # (see .github/workflows/homebrew.yml) -- these tarballs aren't part of
      # that path.
      - name: Build (darwin and linux, arm64 and amd64)
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG=github.com/mtfuller/agentworks/internal/version
          for OS in darwin linux; do
            for ARCH in arm64 amd64; do
              mkdir -p "dist/agentworks_${OS}_${ARCH}"
              GOOS="$OS" GOARCH="$ARCH" go build -trimpath \
                -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${GITHUB_SHA} -X ${PKG}.BuildDate=${BUILD_DATE}" \
                -o "dist/agentworks_${OS}_${ARCH}/agentworks" ./main.go
            done
          done

      # Experimental: built so it can be tried, but not part of the tested
      # matrix's guarantees (see COMPATIBILITY.md).
      - name: Build (windows/amd64, experimental)
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG=github.com/mtfuller/agentworks/internal/version
          mkdir -p dist/agentworks_windows_amd64
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${GITHUB_SHA}" \
            -o dist/agentworks_windows_amd64/agentworks.exe ./main.go
          cp LICENSE README.md dist/agentworks_windows_amd64/
          (cd dist/agentworks_windows_amd64 && zip -q "../../agentworks_${VERSION}_windows_amd64.zip" agentworks.exe LICENSE README.md)
          shasum -a 256 "agentworks_${VERSION}_windows_amd64.zip" >> SHA256SUMS.windows

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          : > SHA256SUMS
          for OS in darwin linux; do
            for ARCH in arm64 amd64; do
              cp LICENSE README.md "dist/agentworks_${OS}_${ARCH}/"
              tar -C "dist/agentworks_${OS}_${ARCH}" -czf "agentworks_${VERSION}_${OS}_${ARCH}.tar.gz" agentworks LICENSE README.md
              shasum -a 256 "agentworks_${VERSION}_${OS}_${ARCH}.tar.gz" >> SHA256SUMS
            done
          done
          cat SHA256SUMS.windows >> SHA256SUMS

      - name: Draft release notes
        run: |
          cat > NOTES.md <<'EOF'
          ## agentworks ${{ github.ref_name }}

          Prebuilt binaries for macOS and Linux, each on arm64 and amd64.

          The macOS binaries are **not notarized**. After downloading and extracting,
          clear the Gatekeeper quarantine flag before first run:

          ```bash
          xattr -d com.apple.quarantine agentworks
          ./agentworks version
          ```

          Verify the download:

          ```bash
          shasum -a 256 -c SHA256SUMS
          ```

          Or install via Homebrew (builds from source, works on both architectures):

          ```bash
          brew install mtfuller/tap/agentworks
          ```
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v1.0.0-rc.1) is a pre-release: it is not offered
          # as "latest" and does not update the Homebrew tap.
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            $PRE \
            --draft \
            --title "agentworks ${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            agentworks_*.tar.gz agentworks_*.zip \
            SHA256SUMS
