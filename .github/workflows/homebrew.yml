name: Update Homebrew tap

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    # Skip pre-releases — only ship stable tags to the tap.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mislav/bump-homebrew-formula-action can only bump ONE url/sha256
      # pair per run (a non-global regex replace) -- fine for a single
      # download, but unsafe for this formula's on_arm/on_intel blocks,
      # which each need their own. Rendering the whole formula from the
      # template in this repo (the source of truth) sidesteps that instead
      # of fighting the action's field-level replace.
      - name: Render the formula for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"   # e.g. v0.0.3
          VERSION="${TAG#v}"                             # e.g. 0.0.3

          gh release download "$TAG" --repo mtfuller/agentworks \
            --pattern SHA256SUMS --output SHA256SUMS --clobber

          ARM64_SHA=$(grep '_darwin_arm64\.tar\.gz$' SHA256SUMS | awk '{print $1}')
          AMD64_SHA=$(grep '_darwin_amd64\.tar\.gz$' SHA256SUMS | awk '{print $1}')

          if [ -z "$ARM64_SHA" ] || [ -z "$AMD64_SHA" ]; then
            echo "::error::couldn't find both darwin_arm64/darwin_amd64 checksums in ${TAG}'s SHA256SUMS"
            exit 1
          fi

          sed \
            -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@SHA256_ARM64@/${ARM64_SHA}/g" \
            -e "s/@SHA256_AMD64@/${AMD64_SHA}/g" \
            homebrew/agentworks.rb.tmpl > agentworks.rb

      - name: Push the formula to mtfuller/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CURRENT_SHA=$(gh api repos/mtfuller/homebrew-tap/contents/Formula/agentworks.rb --jq .sha)
          MESSAGE="agentworks ${TAG}

          Automated bump on release ${TAG}."

          gh api --method PUT repos/mtfuller/homebrew-tap/contents/Formula/agentworks.rb \
            -f message="$MESSAGE" \
            -f content="$(base64 -w0 agentworks.rb)" \
            -f sha="$CURRENT_SHA" \
            -f branch=main
