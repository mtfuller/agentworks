name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      # Floors are ratchets: see scripts/coverage-floors.txt.
      - name: Coverage floors
        run: scripts/check-coverage.sh

      # Dogfood the CI gates on the example project, so a change that would
      # break them for a real project fails here first.
      - name: Check the example project
        run: |
          go build -o "$RUNNER_TEMP/agentworks" .
          cd examples/starter-project
          "$RUNNER_TEMP/agentworks" validate --strict
          "$RUNNER_TEMP/agentworks" doctor
          "$RUNNER_TEMP/agentworks" test
          "$RUNNER_TEMP/agentworks" eval

  # golangci-lint is built with an older Go than "stable" and can't read the
  # newest toolchain's export data, so it runs on the version go.mod declares.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # Vulnerabilities in the standard library depend on the toolchain, so this
  # runs on the newest one -- the same one releases are built with.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The tool is pure Go, but the commands artifacts declare run through a POSIX
  # shell -- macOS has one, and Windows gets Git Bash (preinstalled on the
  # runner). Windows is experimental: see COMPATIBILITY.md.
  portable:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      # Windows builds and vets only: the test suite drives declared commands
      # through sh, POSIX file modes, and shell-quoted paths, none of which
      # exist there yet (see COMPATIBILITY.md).
      - name: Vet
        run: go vet ./...
